<section class="form-panel">
<div class="account-switch"><span id="switchPrompt">New to StudyHub?</span><button id="switchMode" type="button">SIGN UP</button></div>
<div class="form-content"><h1>Welcome to StudyHub!</h1><p class="subtitle" id="formSubtitle">Log in to your account</p>
<form id="loginForm">
<div class="field" id="nameField" hidden><label for="name">Name</label><input id="name" name="name" autocomplete="name" placeholder="Your name" maxlength="80"></div>
<div class="field"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required></div>
<div class="field"><label for="password">Password</label><div class="password-wrap"><input id="password" name="password" type="password" autocomplete="current-password" placeholder="8+ characters" minlength="8" required><button id="togglePassword" class="password-toggle" type="button" aria-label="Show password" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z" stroke="currentColor" stroke-width="1.7"/><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.7"/></svg></button></div></div>
<button class="submit-button" id="submitButton" type="submit">Login</button><p id="formStatus" class="form-status" role="status"></p>
</form>
<div class="social-login"><span>Or continue with</span><button id="googleButton" class="google-button" type="button" aria-label="Continue with Google"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M21.6 12.23c0-.71-.06-1.39-.18-2.05H12v3.88h5.38a4.6 4.6 0 0 1-2 3.02v2.51h3.24c1.9-1.75 2.98-4.33 2.98-7.36Z"/><path fill="#34A853" d="M12 22c2.7 0 4.96-.9 6.62-2.41l-3.24-2.51c-.9.6-2.05.96-3.38.96-2.6 0-4.8-1.76-5.59-4.12H3.07v2.59A10 10 0 0 0 12 22Z"/><path fill="#FBBC05" d="M6.41 13.92a6 6 0 0 1 0-3.84V7.49H3.07a10 10 0 0 0 0 9.02Z"/><path fill="#EA4335" d="M12 5.96c1.47 0 2.79.51 3.83 1.51l2.87-2.87A9.63 9.63 0 0 0 12 2a10 10 0 0 0-8.93 5.49l3.34 2.59A5.99 5.99 0 0 1 12 5.96Z"/></svg></button></div>

</div></section></main>
