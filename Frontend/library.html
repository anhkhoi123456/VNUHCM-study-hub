<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <script>try{document.documentElement.dataset.theme=localStorage.getItem('studyhub-theme')==='dark'?'dark':'light';}catch(e){document.documentElement.dataset.theme='light';}</script>
  <style>html[data-theme="dark"]{background:#0b0913;color-scheme:dark}</style>

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VNU - StudyHub | Kho tài liệu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/dev-banner.css" />
  <link rel="stylesheet" href="css/document-library.css" />
  <link rel="stylesheet" href="css/background.css" />
  <script src="js/background.js" defer></script>
  <link rel="stylesheet" href="css/study-bot.css" />
  <script src="js/study-bot.js" defer></script>
  <link rel="stylesheet" href="css/profile.css" />
  <script src="js/profile.js" defer></script>
  <link rel="stylesheet" href="css/theme.css" />
</head>
<body data-active-nav="library.html" class="document-library-page">
<div class="app-shell">
  <aside class="sidebar" data-app-sidebar></aside>

  <div class="main-content">
    <header class="topbar library-topbar">
      <div class="library-topbar-title"><h1>Kho tài liệu</h1><p>Nơi lưu trữ tài liệu bạn đã lưu</p></div>
      <div class="topbar-actions" data-app-actions></div>
    </header>

    <main class="page-body document-library-body">
      <nav class="document-breadcrumb" aria-label="Đường dẫn">
        <a href="dashboard.html">Trang chủ</a><i class="fa-solid fa-chevron-right" aria-hidden="true"></i>
        <span>ĐHQG TP.HCM</span><i class="fa-solid fa-chevron-right" aria-hidden="true"></i>
        <span>Khoa CNTT</span><i class="fa-solid fa-chevron-right" aria-hidden="true"></i>
        <strong id="breadcrumbCurrent" aria-current="page">Cấu trúc dữ liệu và giải thuật</strong>
      </nav>

      <div class="library-search-row">
        <label class="library-search"><i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i><input id="documentSearch" type="search" placeholder="Tìm tài liệu, môn học, trường đại học..." aria-label="Tìm tài liệu" /></label>
        <button class="filters-toggle" id="filtersToggle" type="button" aria-expanded="true" aria-controls="libraryFilters"><i class="fa-solid fa-filter" aria-hidden="true"></i><span>Bộ lọc</span><i class="fa-solid fa-chevron-up toggle-chevron" aria-hidden="true"></i></button>
      </div>

      <section class="library-filters" id="libraryFilters" aria-label="Bộ lọc tài liệu">
        <div class="filter-group filter-schools"><h2>Trường đại học</h2><div class="filter-chips" role="group" aria-label="Lọc theo trường">
          <button type="button" class="filter-chip active" data-filter="school" data-value="all" aria-pressed="true">Tất cả</button>
          <button type="button" class="filter-chip" data-filter="school" data-value="UIT" aria-pressed="false">UIT</button>
          <button type="button" class="filter-chip" data-filter="school" data-value="HCMUS" aria-pressed="false">HCMUS</button>
          <button type="button" class="filter-chip" data-filter="school" data-value="USSH" aria-pressed="false">USSH</button>
        </div></div>
        <div class="filter-group filter-types"><h2>Loại tài liệu</h2><div class="filter-chips" role="group" aria-label="Lọc theo loại tài liệu">
          <button type="button" class="filter-chip active" data-filter="type" data-value="all" aria-pressed="true">Tất cả</button>
          <button type="button" class="filter-chip" data-filter="type" data-value="pdf" aria-pressed="false"><span class="type-dot pdf">▣</span> PDF</button>
          <button type="button" class="filter-chip" data-filter="type" data-value="doc" aria-pressed="false"><span class="type-dot doc">▣</span> DOC</button>
          <button type="button" class="filter-chip" data-filter="type" data-value="ppt" aria-pressed="false"><span class="type-dot ppt">▣</span> PPT</button>
          <button type="button" class="filter-chip" data-filter="type" data-value="xlsx" aria-pressed="false"><span class="type-dot xlsx">▣</span> XLSX</button>
        </div></div>
        <label class="filter-group filter-select"><span>Môn học</span><select id="subjectFilter"><option value="all" selected>Tất cả môn học</option><option value="ctdl">Cấu trúc dữ liệu và giải thuật</option><option value="he-dieu-hanh">Hệ điều hành</option><option value="xac-suat">Xác suất thống kê</option><option value="mang-may-tinh">Mạng máy tính</option></select></label>
        <label class="filter-group filter-select"><span>Sắp xếp</span><select id="sortDocuments"><option value="newest">Mới nhất</option><option value="oldest">Cũ nhất</option><option value="title">Tên A–Z</option></select></label>
      </section>

      <div class="deleted-documents-notice" id="deletedDocumentsNotice" hidden><span id="deletedDocumentsCount" role="status"></span><button id="restoreDocuments" type="button">Khôi phục tài liệu đã xóa</button></div>
      <div class="document-grid" id="documentGrid" aria-live="polite"></div>
      <p class="documents-empty" id="documentsEmpty" hidden>Không tìm thấy tài liệu phù hợp.</p>
    </main>
  </div>
</div>
<script src="js/main.js"></script>
<script src="js/templates.js"></script>
<script src="js/app-shell.js"></script>
<script src="js/data/catalog.js"></script>
<script src="js/catalog-pages.js"></script>
<script src="js/dev-banner.js"></script>
<script src="js/data/library-documents.js"></script>
<script src="js/library.js"></script>
</body>
</html>
