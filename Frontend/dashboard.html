<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VNU - StudyHub | Trang chủ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/dev-banner.css" />
  <link rel="stylesheet" href="css/dashboard.css" />
  <link rel="stylesheet" href="css/background.css" />
  <script src="js/background.js" defer></script>
  <link rel="stylesheet" href="css/study-bot.css" />
  <script src="js/study-bot.js" defer></script>
</head>
<body data-active-nav="dashboard.html" class="dashboard-page">

<div class="app-shell">

  <!-- ═══ Sidebar ═════════════════════════════════════════════════ -->
  <aside class="sidebar" data-app-sidebar></aside>

  <!-- ═══ Main ═════════════════════════════════════════════════════ -->
  <div class="main-content">

    <!-- Topbar -->
    <header class="topbar">
      <div class="topbar-actions" data-app-actions></div>
    </header>

    <main class="page-body dashboard-body">
      <section class="dashboard-hero" aria-labelledby="welcomeHeading">
        <img class="hero-image" src="../resources/Tim.webp" alt="" aria-hidden="true" />
        <div class="hero-content">
          <h1 id="welcomeHeading">Welcome back, Anh Khoa</h1>
          <form class="dashboard-search" role="search" id="dashboardSearch">
            <input type="search" id="schoolSearch" aria-label="Tìm trường hoặc môn học" placeholder="Tìm trường, môn,... (UIT CTTT Giải tích)." />
            <button type="submit" aria-label="Tìm kiếm"><i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i></button>
          </form>
        </div>
      </section>

      <section class="school-section" aria-labelledby="schoolHeading">
        <h2 id="schoolHeading">CHỌN TRƯỜNG ĐẠI HỌC</h2>
        <div class="school-grid" data-school-grid></div>
      </section>
    </main>
  </div><!-- /main-content -->
</div><!-- /app-shell -->

<script src="js/main.js"></script>
<script src="js/templates.js"></script>
<script src="js/app-shell.js"></script>
<script src="js/data/catalog.js"></script>
<script src="js/catalog-pages.js"></script>
<script src="js/dev-banner.js"></script>
<script src="js/dashboard.js"></script>
</body>
</html>
